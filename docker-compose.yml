version: '3.8'

services:
  tender-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender-backend-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-noreply@tenderportal.gov.in}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Tender Portal}
      - ML_SERVICE_BASE_URL=${ML_SERVICE_BASE_URL:-http://20.40.44.184}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - DIGILOCKER_CLIENT_ID=${DIGILOCKER_CLIENT_ID:-}
      - DIGILOCKER_CLIENT_SECRET=${DIGILOCKER_CLIENT_SECRET:-}
      - DIGILOCKER_REDIRECT_URI=${DIGILOCKER_REDIRECT_URI:-http://localhost:8080/api/officer/auth/digilocker/callback}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/officer/tenders/document-types"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
