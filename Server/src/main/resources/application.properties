spring.application.name=Tender

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Pool Configuration (optimized for Serverless PostgreSQL)
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Brevo Email Configuration
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL:noreply@tenderportal.gov.in}
brevo.sender.name=${BREVO_SENDER_NAME:Tender Portal}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}

# DigiLocker / API Setu OAuth Configuration
digilocker.client.id=${DIGILOCKER_CLIENT_ID:YOUR_DIGILOCKER_CLIENT_ID}
digilocker.client.secret=${DIGILOCKER_CLIENT_SECRET:YOUR_DIGILOCKER_CLIENT_SECRET}
digilocker.redirect.uri=${DIGILOCKER_REDIRECT_URI:http://localhost:8080/api/officer/auth/digilocker/callback}
digilocker.auth.url=${DIGILOCKER_AUTH_URL:https://digilocker.meripehchaan.gov.in/public/oauth2/1/authorize}
digilocker.token.url=${DIGILOCKER_TOKEN_URL:https://digilocker.meripehchaan.gov.in/public/oauth2/1/token}
digilocker.user.url=${DIGILOCKER_USER_URL:https://digilocker.meripehchaan.gov.in/public/oauth2/1/user}

# Rate Limiting
rate-limit.login.requests=5
rate-limit.login.window-seconds=60